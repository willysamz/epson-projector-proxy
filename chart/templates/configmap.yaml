apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "epson-projector-proxy.fullname" . }}
  labels:
    {{- include "epson-projector-proxy.labels" . | nindent 4 }}
data:
  PROJECTOR_HOST: {{ .Values.config.projectorHost | quote }}
  PROJECTOR_PORT: {{ .Values.config.projectorPort | quote }}
  PROJECTOR_TIMEOUT: {{ .Values.config.projectorTimeout | quote }}
  POLL_INTERVAL: {{ .Values.config.pollInterval | default "15.0" | quote }}
  SERVER_PORT: {{ .Values.service.port | quote }}
  LOG_LEVEL: {{ .Values.logging.level | quote }}
  LOG_JSON: {{ .Values.logging.json | quote }}
  MQTT_HOST: {{ .Values.mqtt.host | default "mqtt" | quote }}
  MQTT_PORT: {{ .Values.mqtt.port | default "1883" | quote }}
  MQTT_CLIENT_ID: {{ .Values.mqtt.clientId | default "epson-projector-proxy" | quote }}
  MQTT_TOPIC_PREFIX: {{ .Values.mqtt.topicPrefix | default "epson" | quote }}
  MQTT_KEEPALIVE: {{ .Values.mqtt.keepalive | default "60" | quote }}
  MQTT_QOS: {{ .Values.mqtt.qos | default "0" | quote }}
  HA_DISCOVERY_ENABLED: {{ .Values.ha.discoveryEnabled | default "true" | quote }}
  HA_DISCOVERY_PREFIX: {{ .Values.ha.discoveryPrefix | default "homeassistant" | quote }}
  HA_DEVICE_NAME: {{ .Values.ha.deviceName | default "Epson HC1080 Projector" | quote }}
  HA_DEVICE_ID: {{ .Values.ha.deviceId | default "epson_projector" | quote }}
